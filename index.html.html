<style>
  body{font-family:Inter,system-ui,sans-serif}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;box-shadow:0 1px 2px rgba(15,23,42,.04)}

  .locked-sec{background-image:repeating-linear-gradient(135deg,rgba(148,163,184,.07) 0 10px,transparent 10px 20px)}

  .fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
</style>

      </div>
      <div class="hidden sm:block"><div class="font-bold leading-none">HOSeg</div><div class="text-[11px] text-slate-400 mt-1">Ordens de Serviço · RBAC</div></div>
    </div>
    <nav id="tabs" class="hidden md:flex gap-1 ml-4"></nav>

      <div id="userArea" class="flex items-center gap-3"></div>
    </div>
  </div>
  <nav id="tabsMobile" class="md:hidden flex gap-1 px-4 pb-2 overflow-x-auto"></nav>
  <div id="profileBanner" class="h-1"></div>
</header>

<main class="max-w-[1560px] mx-auto p-4 lg:p-6">
  <div id="permBar" class="mb-5"></div>

</main>
</div>

<div id="modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeModal()"></div>
  <div class="relative min-h-full flex items-start sm:items-center justify-center p-4"><div id="modalBox"></div></div>
</div>

<script>
/* ======================================================================
   PERFIS E PERMISSÕES (RBAC)
====================================================================== */
const PROFILES = {
  Comercial:  { user:'Mariana Costa',  initials:'MC', color:'indigo',  hex:'#6366f1', desc:'Vendas e orçamentos' },
  Tecnico:    { user:'Carlos Menezes', initials:'CM', color:'sky',     hex:'#0ea5e9', desc:'Téc. de Segurança', label:'Técnico' },
  Financeiro: { user:'Patrícia Lemos', initials:'PL', color:'emerald', hex:'#10b981', desc:'Contas a receber' },
  Admin:      { user:'Administrador',  initials:'AD', color:'violet',  hex:'#8b5cf6', desc:'Gestão de acessos', label:'Administrador' }
};
const pLabel = p => PROFILES[p]?.label || p;
const PERMS = {
  'os.criar':['Comercial'], 'cliente.editar':['Comercial'], 'contrato.editar':['Comercial'],
  'orcamento.lancar':['Comercial'], 'orcamento.decisao':['Comercial'], 'os.excluir':['Comercial'], 'os.cancelar':['Comercial'],
  'visita.agendar':['Tecnico'], 'avaliacoes.indicar':['Tecnico'], 'docs.status':['Tecnico'],
  'parcela.baixar':['Financeiro'],
  'usuarios.gerenciar':['Admin']
};
const PERM_LABEL = {
  'os.criar':'Criar OS', 'cliente.editar':'Editar dados do cliente', 'contrato.editar':'Editar contrato (itens, valor, parcelas)',
  'orcamento.lancar':'Lançar orçamento das avaliações', 'orcamento.decisao':'Registrar aprovação/recusa do cliente', 'os.excluir':'Excluir OS aberta por engano', 'os.cancelar':'Cancelar / reativar OS',
  'visita.agendar':'Agendar e registrar visitas técnicas', 'avaliacoes.indicar':'Indicar avaliações necessárias', 'docs.status':'Alterar status dos documentos',
  'parcela.baixar':'Dar baixa / estornar parcelas',
  'usuarios.gerenciar':'Gerenciar usuários e acessos'
};
const can = (a, p = state.perfil) => !(state.ro && p===state.perfil && a!=='usuarios.gerenciar') && (PERMS[a]||[]).includes(p);
function guard(acao, os, descricao){
  if (os?.cancelada) { toast('Esta OS está cancelada: somente leitura. O Comercial pode reativá-la.', 'deny'); return false; }
  if (can(acao)) return true;
  if (os) { addLog(os, `Tentativa bloqueada: ${descricao}`, true); saveDb(); }
  toast(`Acesso negado: "${PERM_LABEL[acao]}" é exclusivo do perfil ${PERMS[acao].map(pLabel).join(', ')}.`, 'deny');
  return false;
}

/* ======================================================================
   CATÁLOGO
====================================================================== */
const CAT_DOCS = [
  { sigla:'PGR',   nome:'Programa de Gerenciamento de Riscos - PGR' },
  { sigla:'PCMSO', nome:'PCMSO - Programa de Controle Médico de Saúde Ocupacional' },
  { sigla:'PCA',   nome:'PCA - Programa de Conservação Auditiva' },
  { sigla:'PPR',   nome:'PPR - Programa de Proteção Respiratória' },
  { sigla:'PPP',   nome:'PPP - Perfil Profissiográfico Previdenciário' },
  { sigla:'LI',    nome:'Laudo de Insalubridade' },
  { sigla:'LP',    nome:'Laudo de Periculosidade' },
  { sigla:'LTCAT', nome:'LTCAT - Laudo Técnico das Condições Ambientais do Trabalho' },
  { sigla:'PSI',   nome:'Avaliação Psicossocial' }
];
const CAT_AVAL = [
  { sigla:'RUI', nome:'Avaliação de Ruído' },
  { sigla:'QUI', nome:'Avaliação de Agentes Químicos' },
  { sigla:'BIO', nome:'Avaliação de Agentes Biológicos' },
  { sigla:'CAL', nome:'Avaliação de Calor (IBUTG)' },
  { sigla:'VIB', nome:'Avaliação de Vibração (VMB/VCI)' }
];
const catBy = s => [...CAT_DOCS, ...CAT_AVAL].find(c => c.sigla === s);
const DOC_STATUS = {
  'Aguardando':   { c:'bg-amber-50 text-amber-700 ring-amber-600/20', dot:'bg-amber-500', on:'bg-amber-500 text-white' },
  'Em Andamento': { c:'bg-sky-50 text-sky-700 ring-sky-600/20', dot:'bg-sky-500', on:'bg-sky-500 text-white' },
  'Concluído':    { c:'bg-emerald-50 text-emerald-700 ring-emerald-600/20', dot:'bg-emerald-500', on:'bg-emerald-500 text-white' }
};
const FORMAS = ['Boleto bancário','PIX','Transferência','Cartão de crédito'];
const tecnicos = () => { const t = (db?.users||[]).filter(u=>u.setor==='Tecnico' && u.ativo).map(u=>u.nome); return t.length ? t : ['—']; };
const UFS = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');

/* ======================================================================
   PERSISTÊNCIA
====================================================================== */
const KEY='hoseg_rbac_v3', SKEY='hoseg_sessao';
let mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
let db = store.get(KEY);
let state = { perfil: null, sel:null, q:'', meus:false, matrix:false, docQ:'', docSt:'Todos', finSt:'Todos' };
const saveDb = () => store.set(KEY, db);

/* ======================================================================
   UTILS
====================================================================== */
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const isoLocal = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const today = () => isoLocal(new Date());
const dPlus = n => { const x = new Date(); x.setDate(x.getDate()+n); return isoLocal(x); };
const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '—';
const fmtDT = t => t ? new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const addMonths = (d,n) => { const x = new Date((d||today())+'T12:00:00'), day = x.getDate(); x.setMonth(x.getMonth()+n); if (x.getDate()<day) x.setDate(0); return isoLocal(x); };
const parseMoney = s => { if (typeof s==='number') return s; s = String(s||'').replace(/[^\d,.-]/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); return +s||0; };
const money2 = v => (+v||0).toFixed(2).replace('.',',');
const $ = id => document.getElementById(id);
const val = id => $(id)?.value ?? '';
const osById = id => db.os.find(o => o.id === id);
const curOs = () => osById(state.sel);
function mask(el, t){
  let v = el.value.replace(/\D/g,'');
  if (t==='cnpj') { v=v.slice(0,14); v=v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); }
  if (t==='tel')  { v=v.slice(0,11); v = v.length>10 ? v.replace(/^(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3') : v.replace(/^(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3').replace(/^(\d{2})(\d{0,4})$/,'($1) $2'); }
  if (t==='cep')  { v=v.slice(0,8); v=v.replace(/^(\d{5})(\d)/,'$1-$2'); }
  el.value = v;
}
const ICON = {
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', check:'<path d="M20 6 9 17l-5-5"/>', trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', cart:'<path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3z"/>', money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>', shield:'<path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>', undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>', map:'<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>', flask:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/>', arrow:'<path d="M5 12h14M13 5l7 7-7 7"/>',
  building:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const ic = (n, c='w-4 h-4') => `<svg class="${c}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${ICON[n]}</svg>`;

/* ======================================================================
   REGRAS DE NEGÓCIO
====================================================================== */
function gerarParcelas(total, n, primeiro){
  n = Math.max(1, Math.min(24, parseInt(n)||1));
  const cents = Math.round(total*100), base = Math.floor(cents/n), resto = cents-base*n;
  return Array.from({length:n}, (_,i) => ({ n:i+1, venc:addMonths(primeiro, i), valor:(base+(i===n-1?resto:0))/100, pago:false, pagoEm:null, pagoPor:null }));
}
function condicao(parc){
  if (!parc?.length) return '—';
  const eq = parc.every(p => Math.abs(p.valor-parc[0].valor) < .005);
  return parc.length===1 ? `À vista ${brl(parc[0].valor)}` : `${parc.length}x de ${eq?'':'~'}${brl(parc[0].valor)}`;
}
function finResumo(parcelas){
  parcelas = parcelas.filter(p => !p.cancelada);
  const total = parcelas.reduce((s,p)=>s+p.valor,0), pago = parcelas.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);
  const pagas = parcelas.filter(p=>p.pago).length;
  return { total, pago, saldo:total-pago, pagas, pend:parcelas.length-pagas, n:parcelas.length, vencidas:parcelas.filter(p=>!p.pago && p.venc<today()).length, pct: total?pago/total*100:0 };
}
const allParcelas = os => os.contratos.flatMap(c => c.parcelas);
const docCode = (os, sigla) => `${os.numero}/${sigla}`;
function addLog(os, msg, denied=false){ os.log.unshift({ t:Date.now(), perfil:state.perfil, user:me().nome, msg, denied }); os.log = os.log.slice(0,100); }
const visita = (os, tipo) => os.visitas.find(v => v.tipo === tipo);

const STEPS = ['Venda','Visita técnica','Indicação de avaliações','Orçamento e aprovação','Visita de avaliações','Documentos'];
function etapa(os){
  if (os.cancelada) return { step:0, label:'OS cancelada', owner:null, cancel:true };
  const v1 = visita(os,'Reconhecimento'), v2 = visita(os,'Avaliações'), s = os.sol;
  const docsDone = os.docs.length && os.docs.every(d => d.status==='Concluído');
  if (!v1?.data) return { step:1, label:'Agendar visita técnica', owner:'Tecnico' };
  if (v1.status!=='Realizada') return { step:1, label:`Visita técnica agendada · ${fmtD(v1.data)}`, owner:'Tecnico' };
  if (!s) return { step:2, label:'Indicar avaliações necessárias', owner:'Tecnico' };
  if (s.status==='Enviada') return { step:3, label:'Lançar orçamento das avaliações', owner:'Comercial' };
  if (s.status==='Orçada') return { step:3, label: s.aceite?.status==='Aguardando cliente' ? 'Aguardando aceite do cliente (e-mail enviado)' : 'Enviar orçamento ao cliente', owner:'Comercial' };
  if (s.status==='Aprovada') {
    const agds = s.itens.filter(i=>i.dataAg);
    if (!agds.length) return { step:4, label:'Agendar as avaliações', owner:'Tecnico' };
    if (v2?.status!=='Realizada') { const tq = s.itens.reduce((t,i)=>t+(+i.qtd||0),0), te = s.itens.reduce((t,i)=>t+Math.min(execTot(os,i.sigla), +i.qtd||0),0), sem = s.itens.length-agds.length;
      return { step:4, label: te ? `Avaliações em execução · ${te}/${tq}` : `Avaliações agendadas · ${fmtD(proxData(s))}${sem?` · ${sem} sem data`:''}`, owner:'Tecnico' }; }
  }
  if (docsDone) return { step:6, label:'Documentos concluídos', owner:null };
  return { step:5, label:'Elaborar documentos', owner:'Tecnico' };
}
const proxData = s => (s?.itens||[]).map(i=>i.dataAg).filter(Boolean).sort()[0] || '';
const execTot = (os, sig, ag) => (os.execucoes||[]).filter(e=>e.sigla===sig && (ag===undefined || e.agente===ag)).reduce((t,e)=>t+(+e.qtd||0),0);
const itemTotal = i => i.agentes?.length ? i.agentes.reduce((t,a)=>t+(+a.qtd||0)*(+a.preco||0),0) : (+i.qtd||0)*(+i.preco||0);
const orcTotal = s => s.itens.reduce((t,i)=>t+itemTotal(i),0);

/* Agentes químicos — referência para a indicação técnica (conferir enquadramento caso a caso) */
const AGENTES_QUIM = [
  { grupo:'Vapores orgânicos (solventes)', ref:'NR-15 Anexo 11 · NR-09/ACGIH', itens:['Tolueno','Xileno','Acetona','Álcool etílico','Metiletilcetona (MEK)','Acetato de etila','Estireno','n-Hexano'] },
  { grupo:'Benzeno', ref:'NR-15 Anexo 13-A (VRT)', itens:['Benzeno'] },
  { grupo:'Poeiras minerais', ref:'NR-15 Anexo 12', itens:['Sílica livre cristalizada','Asbesto / amianto','Manganês e compostos'] },
  { grupo:'Poeiras e particulados', ref:'NR-09 · ACGIH', itens:['Poeira respirável','Poeira total','Poeira de madeira'] },
  { grupo:'Fumos metálicos', ref:'NR-15 Anexos 11/12/13 · ACGIH', itens:['Fumos de solda (ferro)','Fumos de chumbo','Fumos de zinco','Cromo hexavalente','Fumos de alumínio'] },
  { grupo:'Gases', ref:'NR-15 Anexo 11', itens:['Monóxido de carbono','Amônia','Sulfeto de hidrogênio (H₂S)','Dióxido de enxofre','Dióxido de nitrogênio','Cloro'] },
  { grupo:'Névoas e aerossóis', ref:'NR-09 · ACGIH · NR-15 Anexo 13', itens:['Névoas ácidas (ácido sulfúrico)','Névoas de óleo mineral','Névoas de tinta (pintura a pistola)'] },
  { grupo:'Metais e outros', ref:'NR-15 Anexos 11/13', itens:['Mercúrio','Formaldeído','Arsênico','Hidrocarbonetos e compostos de carbono (qualitativo)'] }
];

/* Documentos que dependem do resultado das avaliações */
const DOC_SEM_DEP = ['PSI'];
function bloqueioDoc(os, x){
  if (isAvalDoc(os,x) || DOC_SEM_DEP.includes(x.sigla)) return '';
  const v1 = visita(os,'Reconhecimento'), s = os.sol;
  if (v1?.status!=='Realizada') return 'Liberado após a visita técnica';
  if (!s) return 'Aguardando a indicação das avaliações';
  if (['Enviada','Orçada'].includes(s.status)) return 'Aguardando orçamento/aprovação das avaliações';
  if (s.status==='Aprovada') { const av = os.docs.filter(d=>isAvalDoc(os,d)), c = av.filter(d=>d.status==='Concluído').length;
    if (c < av.length) return `Liberado após as avaliações (${c}/${av.length} concluídas)`; }
  return '';
}

/* Notificações internas */
function notificar(para, os, msg){ (db.notifs = db.notifs || []).unshift({ id:uid(), t:Date.now(), para, osId:os.id, msg, lida:false }); db.notifs = db.notifs.slice(0,200); }
const isAvalDoc = (os, d) => os.contratos.find(c=>c.id===d.contratoId)?.tipo==='Aditivo';

/* Validação do cadastro do cliente — sem estes campos a OS não é aberta */
const REQ_CLIENTE = { razao:'Razão social', cnpj:'CNPJ', grau:'Grau de risco', nFunc:'Nº de funcionários', possuiTurno:'Possui turno', contato:'Nome do contato', email:'E-mail', telefone:'Telefone',
  cep:'CEP', logradouro:'Logradouro', numero:'Número', complemento:'Complemento', bairro:'Bairro', cidade:'Cidade', uf:'UF' };
function cnpjValido(v){
  const n = String(v||'').replace(/\D/g,''); if (n.length!==14 || /^(\d)\1+$/.test(n)) return false;
  const calc = b => { let w = b.length-7, s = 0; for (const ch of b) { s += +ch * w--; if (w<2) w = 9; } const r = s%11; return r<2 ? 0 : 11-r; };
  const d1 = calc(n.slice(0,12)), d2 = calc(n.slice(0,12)+d1); return n.endsWith(`${d1}${d2}`);
}
function validarCliente(d){
  const e = {};
  Object.entries(REQ_CLIENTE).forEach(([k,l]) => { if (!String(d[k]??'').trim()) e[k] = `${l} é obrigatório`; });
  if (!e.cnpj && !cnpjValido(d.cnpj)) e.cnpj = 'CNPJ inválido — confira os dígitos';
  if (!e.cep && String(d.cep).replace(/\D/g,'').length!==8) e.cep = 'CEP deve ter 8 dígitos';
  if (!e.nFunc && !(+d.nFunc>0)) e.nFunc = 'Informe um número maior que zero';
  if (!e.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) e.email = 'E-mail inválido';
  if (!e.telefone && String(d.telefone).replace(/\D/g,'').length<10) e.telefone = 'Telefone incompleto';
  if (d.possuiTurno==='Sim' && !String(d.turnos||'').trim()) e.turnos = 'Descreva os turnos';
  return e;
}
function marcarErros(form, e, ctx='abrir a OS'){
  form.querySelectorAll('.err').forEach(x => x.remove());
  form.querySelectorAll('[name]').forEach(el => { const bad = e[el.name];
    ['!border-rose-400','!ring-2','!ring-rose-100'].forEach(c => el.classList.toggle(c, !!bad));
    const anchor = el.parentElement.classList.contains('flex') ? el.parentElement : el;
    if (bad) anchor.insertAdjacentHTML('afterend', `<div class="err text-[11px] font-medium text-rose-600 mt-1">${esc(bad)}</div>`); });
  const k = Object.keys(e);
  if (k.length) { toast(`Não é possível ${ctx}: ${k.length} campo(s) obrigatório(s) pendente(s) ou inválido(s).`, 'warn'); form.querySelector(`[name="${k[0]}"]`)?.focus(); }
  return !k.length;
}

function ctrPreview(){
  let tot = 0; document.querySelectorAll('[data-preco]').forEach(i => tot += parseMoney(i.value));
  $('cTot').textContent = brl(tot); $('cTot2').textContent = brl(tot);
  $('cR').textContent = tot>0 ? condicao(gerarParcelas(tot, +val('cN'), val('cP'))) : '—';
}
/* lê os valores digitados na tela e recalcula o contrato inicial */
function aplicarContrato(os, exigirTodos){
  const c = os.contratos.find(x=>x.tipo==='Inicial'), docsIni = os.docs.filter(x=>x.contratoId===c.id);
  const antes = c.__sig;
  for (const x of docsIni) { const el = $(`pv-${x.id}`); if (!el) continue; const v = parseMoney(el.value);
    if (v > 0) x.preco = v; else if (exigirTodos) { el.focus(); el.classList.add('!border-rose-400'); toast(`Informe o valor de ${x.sigla}`, 'warn'); return false; } }
  const total = docsIni.reduce((t,x)=>t+(+x.preco||0),0);
  c.parcelas = total > 0 ? gerarParcelas(total, +(val('cN')||c.parcelas.length), val('cP')||c.parcelas[0]?.venc) : [];
  c.forma = val('cF') || c.forma;
  const sig = JSON.stringify([os.docs.filter(x=>x.contratoId===c.id).map(x=>[x.sigla,x.preco]), c.parcelas.map(p=>[p.venc,p.valor]), c.forma]);
  if (c.aceite?.snap) { const snapSig = JSON.stringify([c.aceite.snap.itens.map(i=>[i.desc.split(' — ')[0], i.unit]), c.aceite.snap.parcelas.map(p=>[p.venc,p.valor]), c.aceite.snap.forma]); if (sig !== snapSig) invalidarAceite(os,'inicial'); }
  return true;
}

const portalUrl = tk => `${location.href.split('#')[0]}#aceite-${tk}`;

function enviarAceite(osId, tipo){

  const email = os.cliente.email; if (!email) return toast('Cadastre o e-mail do cliente nos Dados do Cliente', 'warn');

function responderAceite(tk, aceitou){
  const r = findToken(tk); if (!r) return; const { os, tipo, a } = r, f = $('aceiteForm');
  const nome = f.nome.value.trim(), cargo = f.cargo.value.trim(), motivo = f.motivo.value.trim();
  if (nome.split(/\s+/).length < 2) { f.nome.focus(); return toast('Informe seu nome completo', 'warn'); }
  if (aceitou && !f.concordo.checked) return toast('Marque a confirmação de que concorda com os valores e parcelas', 'warn');
  if (!aceitou) { $('recusaBox').classList.remove('hidden'); if (!motivo) { f.motivo.focus(); return toast('Informe o motivo da recusa', 'warn'); } }
  a.status = aceitou ? 'Aceito' : 'Recusado'; a.resposta = { nome, cargo, motivo, em:Date.now() };
  const quem = `${nome} (cliente)`, rot = tipo==='inicial' ? 'a proposta inicial' : 'o orçamento das avaliações';
  os.log.unshift({ t:Date.now(), perfil:'Cliente', user:quem, msg:`Cliente ${aceitou?'CONFIRMOU':'RECUSOU'} ${rot} pelo link do e-mail${aceitou?` · ${brl(a.snap.total)} · ${condicao(a.snap.parcelas)}`:` · motivo: ${motivo}`}`, denied:false });
  if (tipo==='aditivo') { if (aceitou) aprovarAditivo(os, quem); else { os.sol.status = 'Recusada'; os.sol.decididaEm = Date.now(); } }
  notificar('Comercial', os, `${os.cliente.fantasia||os.cliente.razao} ${aceitou?'confirmou':'recusou'} ${rot}${aceitou?` (${brl(a.snap.total)})`:''}`);
  if (aceitou) notificar('Financeiro', os, `Parcelas confirmadas pelo cliente (${tipo==='inicial'?'contrato inicial':'aditivo'}): ${condicao(a.snap.parcelas)}`);
  const com = db.users.find(u => u.nome===os.criadoPor)?.email || db.users.filter(u=>u.setor==='Comercial' && u.ativo).map(u=>u.email).join(', ');
  (db.emails = db.emails || []).unshift({ id:uid(), t:Date.now(), osId:os.id, tipo:'retorno', para:com || 'comercial@hoseg.com.br',
    assunto:`${aceitou?'✔ Cliente confirmou':'✖ Cliente recusou'} ${rot} · ${os.numero}`,
    corpo:`A empresa ${os.cliente.fantasia||os.cliente.razao} ${aceitou?'confirmou':'recusou'} ${rot} da OS ${os.numero}.\n\nResponsável: ${nome}${cargo?` — ${cargo}`:''}\nData/hora: ${fmtDT(Date.now())}\nValor: ${brl(a.snap.total)} · ${condicao(a.snap.parcelas)} · ${a.snap.forma}${aceitou?'':`\nMotivo: ${motivo}`}\n\nAcesse o sistema para dar continuidade.` });
  saveDb(); renderPortal(tk);
}

function saveCliente(e){
  e.preventDefault(); const os = curOs();
  if (!guard('cliente.editar', os, 'editar dados do cliente')) return render();
  const d = Object.fromEntries(new FormData(e.target));
  if (!marcarErros(e.target, validarCliente(d), 'salvar o cadastro')) return;
  const mud = [];
  if (e.target.__receita) { os.cliente.receita = e.target.__receita; mud.push('cartão CNPJ'); }
  Object.keys(d).forEach(k => { if ((os.cliente[k]||'') !== (d[k]||'')) { mud.push(k); os.cliente[k] = d[k]; } });
  if (!mud.length) return toast('Nenhuma alteração', 'info');
  addLog(os, `Dados do cliente atualizados (${mud.length} campo(s))`); saveDb(); toast('Cliente salvo'); render();
}
function saveContrato(){
  const os = curOs(); if (!guard('contrato.editar', os, 'editar contrato')) return render();
  const c = os.contratos.find(x=>x.tipo==='Inicial');
  if (c.parcelas.some(p=>p.pago)) return toast('Condição travada: já existe parcela paga', 'deny');
  if (!aplicarContrato(os, true)) return;
  const itens = os.docs.filter(x=>x.contratoId===c.id);
  addLog(os, `Contrato inicial: ${itens.map(x=>`${x.sigla} ${brl(x.preco)}`).join(' + ')} = ${brl(finResumo(c.parcelas).total)} · ${condicao(c.parcelas)} · ${c.forma}`);
  saveDb(); toast(`Valores salvos · total ${brl(finResumo(c.parcelas).total)}`); render();
}
function addDoc(){
  const os = curOs(); if (!guard('contrato.editar', os, 'adicionar documento')) return;
  const c = os.contratos.find(x=>x.tipo==='Inicial');
  if (c.parcelas.some(p=>p.pago)) return toast('Itens travados: já existe parcela paga', 'deny');
  const k = catBy(val('addDocSel')), preco = parseMoney(val('addDocVal'));
  if (!(preco > 0)) { $('addDocVal')?.focus(); return toast(`Informe o valor de ${k.sigla} para adicionar`, 'warn'); }
  os.docs.push({ id:uid(), sigla:k.sigla, nome:k.nome, contratoId:c.id, preco, status:'Aguardando', updatedAt:null, updatedBy:null });
  aplicarContrato(os, false);
  addLog(os, `Item contratado: ${docCode(os,k.sigla)} — ${k.nome} · ${brl(preco)} · novo total ${brl(finResumo(c.parcelas).total)}`); saveDb(); toast(`${k.sigla} adicionado · total ${brl(finResumo(c.parcelas).total)}`); render();
}
function removeDoc(id){
  const os = curOs(); if (!guard('contrato.editar', os, 'remover documento')) return;
  const c = os.contratos.find(x=>x.tipo==='Inicial'), x = os.docs.find(d=>d.id===id);
  if (c.parcelas.some(p=>p.pago)) return toast('Itens travados: já existe parcela paga', 'deny');
  if (x.status!=='Aguardando') { addLog(os, `Remoção recusada: ${docCode(os,x.sigla)} já está ${x.status}`, true); saveDb(); render(); return toast('Documento já iniciado pelo Técnico não pode ser removido', 'deny'); }
  if (os.docs.filter(d=>d.contratoId===c.id).length === 1) return toast('A OS precisa de ao menos um item contratado', 'warn');
  os.docs = os.docs.filter(d=>d.id!==id); aplicarContrato(os, false);
  addLog(os, `Item removido: ${docCode(os,x.sigla)} (${brl(x.preco)}) · novo total ${brl(finResumo(c.parcelas).total)}`); saveDb(); render();
}
function agendarVisita(vid){
  const os = curOs(); const v = os.visitas.find(x=>x.id===vid);
  if (!guard('visita.agendar', os, `agendar ${v.tipo}`)) return render();

function setDocStatus(osId, docId, st){

function lancarExec(){
  const os = curOs(); if (!guard('visita.agendar', os, 'lançar execução de avaliações')) return render();

  const it = os.sol.itens.find(i=>i.sigla===sig), a = ag ? it.agentes.find(x=>x.nome===ag) : null;
  const saldo = a ? a.qtd - execTot(os, sig, ag) : it.qtd - execTot(os, sig), nome = `${catBy(sig).nome}${ag?` — ${ag}`:''}`;
  if (!data) return toast('Informe a data em que a avaliação foi realizada', 'warn');
  if (data > today()) return toast('A data realizada não pode ser futura', 'warn');
  if (!(qtd>0)) return toast('Informe a quantidade realizada', 'warn');
  if (qtd > saldo) return toast(`Quantidade acima do contratado: restam ${saldo} de ${nome}`, 'warn');
  (os.execucoes = os.execucoes || []).push({ id:uid(), data, sigla:sig, ...(ag?{ agente:ag }:{}), qtd, obs:val('ex-obs').trim(), por:me().nome, t:Date.now() });

  if (doc && doc.status==='Aguardando') { doc.status = 'Em Andamento'; doc.updatedAt = Date.now(); doc.updatedBy = me().nome; }
  atualizarV2(os);
  addLog(os, `Avaliação realizada em ${fmtD(data)}: ${nome} × ${qtd} (total ${catBy(sig).nome}: ${execTot(os,sig)}/${it.qtd})`); saveDb();
  toast(`${nome}: lançado · ${execTot(os,sig)}/${it.qtd}`); render();

function atualizarV2(os){
  const v = visita(os,'Avaliações'); if (!v || !os.sol) return;
  const ex = os.execucoes||[], completo = os.sol.itens.every(i => execTot(os,i.sigla) >= i.qtd);
  const prox = os.sol.itens.filter(i => execTot(os,i.sigla) < i.qtd && i.dataAg).map(i=>i.dataAg).sort();
  v.data = prox[0] || proxData(os.sol);
  v.status = completo ? 'Realizada' : ex.length ? 'Em execução' : (v.data ? 'Agendada' : 'A agendar');

function toast(msg, type='ok'){
  const el = document.createElement('div');
  const s = { ok:['bg-slate-900','check'], info:['bg-indigo-600','shield'], warn:['bg-amber-600','alert'], deny:['bg-rose-600','lock'] }[type];
  el.className = `${s[0]} text-white text-sm px-4 py-3 rounded-xl shadow-xl flex items-start gap-2 fade`;
  el.innerHTML = `<span class="mt-0.5 shrink-0">${ic(s[1])}</span><span>${esc(msg)}</span>`;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, type==='deny'?3800:2500);
}

/* ======================================================================
   AUTENTICAÇÃO (protótipo: usuários e hash de senha ficam no navegador)
====================================================================== */
function sha256(str){
  const ascii = unescape(encodeURIComponent(str));
  const rr = (v,a) => (v>>>a)|(v<<(32-a)), maxWord = 2**32, words = [], bitLen = ascii.length*8;
  let hash = [], k = [], pc = 0; const comp = {};
  for (let cand = 2; pc < 64; cand++) { if (!comp[cand]) { for (let i = 0; i < 313; i += cand) comp[i] = cand; hash[pc] = (Math.pow(cand,.5)*maxWord)|0; k[pc++] = (Math.pow(cand,1/3)*maxWord)|0; } }
  hash = hash.slice(0,8);
  let m = ascii + '\x80'; while (m.length%64 - 56) m += '\x00';
  for (let i = 0; i < m.length; i++) words[i>>2] |= m.charCodeAt(i) << ((3-i)%4)*8;
  words[words.length] = (bitLen/maxWord)|0; words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16), old = hash; hash = hash.slice(0,8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i-15], w2 = w[i-2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i]
        + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash); hash[4] = (hash[4]+t1)|0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i]+old[i])|0;
  }
  let out = ''; for (let i = 0; i < 8; i++) for (let j = 3; j+1; j--) { const b = (hash[i]>>(j*8))&255; out += (b<16?'0':'') + b.toString(16); }
  return out;
}

  const err = m => { $('loginErr').innerHTML = `<div class="rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm px-3 py-2 flex items-center gap-2">${ic('lock')}${esc(m)}</div>`; f.classList.remove('fade'); void f.offsetWidth; f.classList.add('fade'); };
  if (!login || !senha) return err('Informe usuário e senha.');
  const u = db.users.find(x => x.login === login);
  const reg = (ok, motivo) => { db.acessos.unshift({ t:Date.now(), login, ok, motivo }); db.acessos = db.acessos.slice(0,300); saveDb(); };
  if (!u || u.senhaHash !== hashSenha(login, senha)) { reg(false,'Usuário ou senha inválidos'); return err('Usuário ou senha inválidos.'); }
  if (!u.ativo) { reg(false,'Usuário desativado'); return err('Usuário desativado. Procure o administrador.'); }
  u.ultimoAcesso = Date.now(); reg(true,''); store.set(SKEY, u.id);
  startApp(true);
  if (u.trocarSenha) openTrocarSenha(true);
}
function startApp(welcome){
  const u = me(); if (!u) return renderLogin();
  $('loginScreen').classList.add('hidden'); $('loginScreen').innerHTML = ''; $('app').classList.remove('hidden');
  state.perfil = u.setor; state.meus = false;
  if (u.setor==='Admin' && !location.hash) location.hash = 'usuarios';

}

        <button class="btn bg-indigo-600 text-white hover:bg-indigo-700">${ic('check')}Salvar senha</button></div></form></div>`, 'max-w-md');

    if (!forced && hashSenha(u.login, d.atual) !== u.senhaHash) return toast('Senha atual incorreta', 'deny');

const fetchT = (url, ms=7000) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(url, { signal:c.signal }).finally(() => clearTimeout(t)); };
const titleCase = s => String(s||'').toLowerCase().replace(/(^|\s|\/|-)(\p{L})/gu, (m,a,b) => a+b.toUpperCase()).replace(/\s(De|Da|Do|Dos|Das|E)\s/g, m => m.toLowerCase());

function setBusy(form, name, busy){
  const b = form.querySelector(`[data-lookup="${name}"]`); if (!b) return;
  b.disabled = busy; b.innerHTML = busy ? '<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 3a9 9 0 1 0 9 9" stroke-linecap="round"/></svg>' : ic('search');
}
function preencher(form, data){
  let n = 0;
  Object.entries(data).forEach(([k,v]) => { const el = form.elements[k]; if (!el || v===undefined || v===null || v==='') return;
    el.value = v; n++; el.classList.add('!bg-emerald-50','!border-emerald-300'); setTimeout(() => el.classList.remove('!bg-emerald-50','!border-emerald-300'), 2200); });
  return n;
}
async function buscarCep(form){
  const el = form.elements.cep; if (!el || el.disabled) return;
  const cep = el.value.replace(/\D/g,'');
  if (cep.length !== 8) { toast('Digite os 8 dígitos do CEP e pressione Enter', 'warn'); return el.focus(); }
  setBusy(form, 'cep', true);
  let r = null, demo = false;
  try {
    const j = await (await fetchT(`https://viacep.com.br/ws/${cep}/json/`)).json();

async function buscarCnpj(form){

  let j = null, fonte = 'BrasilAPI · dados abertos da Receita Federal';

    cidade: titleCase(j.municipio), uf: j.uf, telefone: j.ddd_telefone_1 ? maskStr(j.ddd_telefone_1,'tel') : '', email: (j.email||'').toLowerCase()
  });
  const rec = { fonte, em:Date.now(), situacao:j.descricao_situacao_cadastral, abertura:j.data_inicio_atividade, natureza:j.natureza_juridica, porte:j.porte || j.descricao_porte,

    socios:(j.qsa||[]).slice(0,8).map(x=>`${titleCase(x.nome_socio)} — ${x.qualificacao_socio||''}`) };

  const ativa = /ATIVA/i.test(rec.situacao||'');
  if (!ativa) toast(`Atenção: situação cadastral "${rec.situacao}" na Receita Federal`, 'deny');
  else toast(fonte==='demo' ? 'Consulta online bloqueada neste ambiente — dados FICTÍCIOS de demonstração preenchidos' : 'Dados preenchidos conforme cartão CNPJ · confirme o Grau de risco (NR-4) e o Nº de funcionários', fonte==='demo'?'warn':'ok');
  const pend = {}; if (!form.elements.grau.value) pend.grau = `Defina pelo CNAE ${rec.cnae} (NR-4, Quadro I)`; if (!form.elements.nFunc.value) pend.nFunc = 'Não consta no cartão CNPJ — informe';
  form.querySelectorAll('.err').forEach(x=>x.remove());
  Object.entries(pend).forEach(([k,m]) => form.elements[k].insertAdjacentHTML('afterend', `<div class="err text-[11px] font-medium text-amber-600 mt-1">${esc(m)}</div>`));
}

  $('exForm').addEventListener('submit', e => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target));

function cancelarOs(){

function reativarOs(){

function abrirImpressao(){

    ${podeValores?`<label class="flex items-center gap-2 text-xs font-medium cursor-pointer"><input type="checkbox" ${window.__pv?'checked':''} onchange="state.printValores=this.checked;abrirImpressao()" class="accent-indigo-600">Incluir valores</label>`:`<span class="text-[11px] text-slate-500">${ic('lock','w-3 h-3 inline')} Valores não aparecem na ficha do técnico</span>`}
    <button onclick="imprimirAgora()" class="btn bg-slate-900 text-white hover:bg-slate-800">${ic('doc')}Imprimir</button>
    <button onclick="baixarImpressao()" class="btn bg-indigo-600 text-white hover:bg-indigo-700">${ic('arrow')}Baixar para imprimir</button>
    <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400">${ic('x','w-5 h-5')}</button></div>
    <div class="px-6 py-2 text-[11px] text-amber-800 bg-amber-50 border-b border-amber-100">No link publicado a impressão direta pode ser bloqueada pelo navegador. Nesse caso use <b>Baixar para imprimir</b>: o arquivo abre já com a janela de impressão (ou “Salvar como PDF”).</div>
    <iframe id="printFrame" class="w-full bg-slate-100" style="height:70vh;border:0"></iframe>`, 'max-w-5xl');
  $('printFrame').srcdoc = html.replace("window.addEventListener('load',()=>setTimeout(()=>{try{window.print()}catch(e){}},500));", '');
  window.__printHtml = html;

function imprimirAgora(){
  const f = $('printFrame');
  try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e) { toast('A impressão direta foi bloqueada aqui. Use "Baixar para imprimir".', 'warn'); }
}
async function baixarImpressao(){
  const os = curOs(), name = `${os.numero}_${(os.cliente.fantasia||os.cliente.razao).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-')}.html`;
  if (DL) { try { await DL.save({ filename:name, data:window.__printHtml }); toast('Arquivo salvo · abra-o para imprimir'); }
    catch(e) { if (e?.code !== 'declined') toast('Não foi possível salvar o arquivo aqui.', 'warn'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([window.__printHtml], { type:'text/html' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Arquivo baixado · abra-o para imprimir'); }
  catch(e) { toast('O download foi bloqueado neste ambiente.', 'warn'); }
}

  // OS por etapa (barra horizontal, uma série)

    ], histEventos().length, evs.length, `<span class="text-[11px] text-slate-500">eventos no histórico · o período também filtra os indicadores</span>`) + `

      ${porMes.length ? `<div class="relative h-48 flex items-end gap-3 border-b border-slate-200 pl-1">${porMes.map(m=>`<div class="group relative flex-1 h-full flex items-end justify-center gap-0.5">

        <div class="flex gap-3 pl-1 mt-1">${porMes.map(m=>`<div class="flex-1 text-center text-[10px] text-slate-500">${mesLbl(m.k)}</div>`).join('')}</div>
        <details class="mt-3"><summary class="text-[11px] text-slate-500 cursor-pointer">Ver tabela</summary><table class="w-full text-xs mt-2"><thead class="text-slate-500"><tr><th class="text-left py-1">Mês</th><th class="text-right">Recebido</th><th class="text-right">A receber</th></tr></thead><tbody>${porMes.map(m=>`<tr class="border-t border-slate-100"><td class="py-1">${mesLbl(m.k)}</td><td class="text-right font-mono">${brl(m.rec)}</td><td class="text-right font-mono">${brl(m.aRec)}</td></tr>`).join('')}</tbody></table></details>`
